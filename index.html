<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小猫猫的摸摸券银行</title>
<style>
:root {
  --bg: #f9f6f1;
  --card: #ffffff;
  --text: #3d3226;
  --sub: #9b8c7c;
  --accent: #e8836b;
  --accent-hover: #d4725a;
  --border: #e8e0d5;
  --green: #7d9b76;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-lg: 0 2px 6px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06);
  --radius: 14px;
  --radius-sm: 10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 32px 20px 60px;
}

/* Header */
.header {
  text-align: center;
  padding: 20px 0 10px;
  position: relative;
}

.header-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 2px;
}

.header-dog {
  display: block;
  margin: 8px auto 0;
  width: 80px;
  height: 80px;
  image-rendering: auto;
}

/* Balance */
.balance-section {
  text-align: center;
  padding: 16px 20px 24px;
}

.balance-amount {
  font-size: 72px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  transition: transform 0.3s;
}

.balance-amount.pop { animation: pop 0.4s ease; }

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.balance-unit {
  font-size: 15px;
  color: var(--sub);
  margin-top: 6px;
  letter-spacing: 1px;
}

/* Admin bar */
.admin-bar {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.admin-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--sub);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.admin-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Section titles */
.section-title {
  font-size: 14px;
  color: var(--sub);
  letter-spacing: 2px;
  margin-bottom: 14px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.section-title::before, .section-title::after {
  content: '';
  width: 30px;
  height: 1px;
  background: var(--border);
}

/* Messages */
.messages-section {
  margin-bottom: 28px;
}

.message-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  border-left: 3px solid var(--accent);
  position: relative;
}

.message-card .msg-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text);
}

.message-card .msg-time {
  font-size: 12px;
  color: var(--sub);
  margin-top: 8px;
}

.message-empty {
  text-align: center;
  color: var(--sub);
  font-size: 14px;
  padding: 16px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* Tasks */
.tasks-section {
  margin-bottom: 28px;
}

.task-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.task-card .task-icon {
  font-size: 28px;
  flex-shrink: 0;
}

.task-card .task-info {
  flex: 1;
  min-width: 0;
}

.task-card .task-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.task-card .task-progress {
  font-size: 12px;
  color: var(--sub);
}

.task-card .task-progress-bar {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}

.task-card .task-progress-bar .fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width 0.3s;
}

.task-card .task-btn {
  padding: 8px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  flex-shrink: 0;
  white-space: nowrap;
}

.task-card .task-btn:hover {
  background: var(--accent-hover);
}

.task-card .task-btn:active {
  transform: scale(0.95);
}

/* Service cards */
.services-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 32px;
}

.service-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 16px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s;
  border: 1.5px solid transparent;
  text-align: center;
  position: relative;
}

.service-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.service-card:active { transform: scale(0.97); }

.service-card .icon {
  font-size: 36px;
  margin-bottom: 10px;
  display: block;
}

.service-card .name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.service-card .price {
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
}

.service-card .price span {
  font-size: 16px;
  font-weight: 700;
}

.service-card.add-card {
  border-style: dashed;
  border-color: var(--border);
  opacity: 0.7;
}

.service-card.add-card:hover { opacity: 1; border-color: var(--accent); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.3);
  z-index: 100;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px 24px;
  width: 90%;
  max-width: 380px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.15);
  animation: slideUp 0.3s ease;
  max-height: 85vh;
  overflow-y: auto;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal h3 {
  font-size: 20px;
  margin-bottom: 8px;
  text-align: center;
}

.modal .modal-icon {
  font-size: 48px;
  text-align: center;
  margin-bottom: 12px;
}

.modal label {
  display: block;
  font-size: 13px;
  color: var(--sub);
  margin-bottom: 6px;
}

.modal input, .modal textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 12px;
  resize: vertical;
}

.modal input:focus, .modal textarea:focus { border-color: var(--accent); }

.modal .modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}

.modal .btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.modal .btn-cancel { background: var(--bg); color: var(--sub); }
.modal .btn-cancel:hover { background: var(--border); }
.modal .btn-confirm { background: var(--accent); color: #fff; }
.modal .btn-confirm:hover { background: var(--accent-hover); }

.modal .btn-delete {
  background: none;
  color: #c62828;
  font-size: 13px;
  font-weight: 400;
  padding: 8px;
  margin-top: 8px;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  font-family: inherit;
}

.modal .price-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.modal .price-row input { width: 80px; margin-bottom: 0; }
.modal .price-row span { color: var(--sub); font-size: 14px; }

/* History */
.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  font-size: 14px;
}

.history-item .hi-icon { font-size: 24px; flex-shrink: 0; }
.history-item .hi-info { flex: 1; min-width: 0; }
.history-item .hi-name {
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-item .hi-time { font-size: 12px; color: var(--sub); }
.history-item .hi-cost { font-weight: 600; color: var(--accent); flex-shrink: 0; }
.history-item .hi-earn { font-weight: 600; color: var(--green); flex-shrink: 0; }

.history-empty {
  text-align: center;
  color: var(--sub);
  font-size: 14px;
  padding: 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.toast.show { opacity: 1; }

/* Confetti */
.confetti-piece {
  position: fixed;
  z-index: 150;
  pointer-events: none;
  animation: confettiFall 1.5s ease-out forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 400px) {
  .services-grid { grid-template-columns: 1fr; }
  .balance-amount { font-size: 56px; }
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="header-title">🐱 小猫猫的摸摸券银行</div>
    <img class="header-dog" id="headerDog" alt="线条小狗" src="">
  </div>

  <div class="balance-section">
    <div class="balance-amount" id="balance">20</div>
    <div class="balance-unit">张 摸 摸 券</div>
  </div>

  <div class="admin-bar">
    <button class="admin-btn" onclick="adjustCoupons(1)">+ 发券</button>
    <button class="admin-btn" onclick="adjustCoupons(-1)">- 减券</button>
    <button class="admin-btn" onclick="openWriteMessage()">✎ 留言</button>
    <button class="admin-btn" onclick="resetAll()">重置</button>
  </div>

  <!-- 留言板 -->
  <div class="messages-section" id="messagesSection">
    <div class="section-title">💌 留言板</div>
    <div id="messagesList"></div>
  </div>

  <!-- 任务 -->
  <div class="tasks-section" id="tasksSection">
    <div class="section-title">🎯 每日任务</div>
    <div id="tasksList"></div>
  </div>

  <!-- 服务卡片 -->
  <div class="section-title">🛒 兑换服务</div>
  <div class="services-grid" id="servicesGrid"></div>

  <!-- 兑换记录 -->
  <div class="section-title">📋 兑换记录</div>
  <div id="historyList"></div>

</div>

<!-- 通用弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon" id="modalIcon"></div>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-confirm" id="confirmBtn" onclick="confirmRedeem()">确认兑换</button>
    </div>
    <button class="btn-delete" id="deleteBtn" style="display:none" onclick="deleteService()">删除这个服务</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 配置 ============
const SERVER_KEY = 'SCT403508TEFSic7kAfmNpYi22Zxku0ID7';

const DEFAULT_SERVICES = [
  { id: 'touch', name: '摸摸10分钟', icon: '🤲', price: 1 },
  { id: 'hug', name: '抱抱', icon: '🤗', price: 1 },
  { id: 'kiss', name: '亲亲', icon: '💋', price: 1 },
  { id: 'errand', name: '跑腿服务', icon: '🏃', price: 1 },
  { id: 'chores', name: '做家务', icon: '🧹', price: 3 },
  { id: 'cheer', name: '哄开心', icon: '🎤', price: 3 },
];

const INITIAL_COUPONS = 20;

// ============ 线条小狗绘制 ============
function drawLineDog() {
  const c = document.createElement('canvas');
  c.width = 160; c.height = 160;
  const t = c.getContext('2d');
  t.imageSmoothingEnabled = true;
  t.scale(2, 2);

  t.strokeStyle = '#4a3728';
  t.lineWidth = 2;
  t.lineCap = 'round';
  t.lineJoin = 'round';
  t.fillStyle = '#fff';

  // 身体
  t.beginPath();
  t.ellipse(40, 55, 20, 16, 0, 0, Math.PI * 2);
  t.fill();
  t.stroke();

  // 头
  t.beginPath();
  t.ellipse(40, 30, 16, 14, 0, 0, Math.PI * 2);
  t.fill();
  t.stroke();

  // 左耳
  t.fillStyle = '#FFE0B2';
  t.beginPath();
  t.moveTo(28, 22);
  t.lineTo(22, 10);
  t.lineTo(34, 20);
  t.closePath();
  t.fill();
  t.stroke();

  // 右耳
  t.beginPath();
  t.moveTo(52, 22);
  t.lineTo(58, 10);
  t.lineTo(46, 20);
  t.closePath();
  t.fill();
  t.stroke();

  // 眼睛
  t.fillStyle = '#4a3728';
  t.beginPath();
  t.arc(35, 28, 3, 0, Math.PI * 2);
  t.fill();
  t.beginPath();
  t.arc(47, 28, 3, 0, Math.PI * 2);
  t.fill();

  // 鼻子
  t.beginPath();
  t.arc(41, 32, 2.5, 0, Math.PI * 2);
  t.fill();

  // 嘴
  t.strokeStyle = '#4a3728';
  t.lineWidth = 1.5;
  t.beginPath();
  t.moveTo(41, 34);
  t.lineTo(38, 37);
  t.moveTo(41, 34);
  t.lineTo(44, 37);
  t.stroke();

  // 腮红
  t.fillStyle = 'rgba(255,150,150,0.5)';
  t.beginPath();
  t.arc(30, 33, 4, 0, Math.PI * 2);
  t.fill();
  t.beginPath();
  t.arc(52, 33, 4, 0, Math.PI * 2);
  t.fill();

  // 前腿
  t.strokeStyle = '#4a3728';
  t.lineWidth = 2;
  t.beginPath();
  t.moveTo(30, 65);
  t.lineTo(26, 75);
  t.moveTo(48, 65);
  t.lineTo(52, 75);
  t.stroke();

  // 尾巴
  t.beginPath();
  t.moveTo(58, 48);
  t.quadraticCurveTo(68, 38, 64, 28);
  t.stroke();

  return c.toDataURL();
}

document.getElementById('headerDog').src = drawLineDog();

// ============ 音效 ============
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (type === 'redeem') {
      // 兑换成功：上升三连音
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.1 + 0.05);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.1 + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + i * 0.1 + 0.3);
      });
    } else if (type === 'earn') {
      // 赚券：叮咚
      [880, 1100].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.12);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.12 + 0.04);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.12 + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.12);
        osc.stop(ctx.currentTime + i * 0.12 + 0.25);
      });
    }
  } catch(e) {}
}

// ============ 状态 ============
let coupons = INITIAL_COUPONS;
let services = [];
let customServices = [];
let history = [];
let messages = [];
let mealRecords = [];
let mealsGranted = 0;
let currentService = null;
let modalMode = null;

function load() {
  try {
    const d = JSON.parse(localStorage.getItem('coupon_state'));
    if (d) {
      coupons = d.coupons ?? INITIAL_COUPONS;
      history = d.history ?? [];
      customServices = d.customServices ?? [];
      messages = d.messages ?? [];
      mealRecords = d.mealRecords ?? [];
      mealsGranted = d.mealsGranted ?? 0;
    }
  } catch(e) {}
  services = [...DEFAULT_SERVICES, ...customServices];
}

function save() {
  localStorage.setItem('coupon_state', JSON.stringify({
    coupons, history, customServices, messages, mealRecords, mealsGranted
  }));
}

// ============ 线条小狗 ============

  const c = document.createElement('canvas');
  c.width = 160; c.height = 160;
  const t = c.getContext('2d');
  t.imageSmoothingEnabled = true;
  t.scale(2, 2);

  t.strokeStyle = '#4a3728';

  t.fillStyle = '#fff';

  t.stroke();

  // 头
  t.beginPath();

  t.fill();
  t.stroke();

  // 耳朵
  t.fillStyle = '#FFE0B2';
  t.beginPath();
  t.moveTo(28, 22);
  t.lineTo(22, 10);
  t.lineTo(34, 20);
  t.closePath();
  t.fill();
  t.stroke();
  t.beginPath();
  t.moveTo(52, 22);
  t.lineTo(58, 10);
  t.lineTo(46, 20);
  t.closePath();
  t.fill();
  t.stroke();

  // 眼睛
  t.fillStyle = '#4a3728';
  t.beginPath();
  t.arc(35, 28, 3, 0, Math.PI * 2);
  t.fill();
  t.beginPath();
  t.arc(47, 28, 3, 0, Math.PI * 2);
  t.fill();

  // 鼻子
  t.beginPath();
  t.arc(41, 32, 2.5, 0, Math.PI * 2);
  t.fill();

  // 嘴
  t.strokeStyle = '#4a3728';
  t.lineWidth = 1.5;
  t.beginPath();
  t.moveTo(41, 34);
  t.lineTo(38, 37);
  t.moveTo(41, 34);
  t.lineTo(44, 37);
  t.stroke();

  // 腮红
  t.fillStyle = 'rgba(255,150,150,0.5)';
  t.beginPath();
  t.arc(30, 33, 4, 0, Math.PI * 2);
  t.fill();
  t.beginPath();
  t.arc(52, 33, 4, 0, Math.PI * 2);
  t.fill();

  // 前腿
  t.strokeStyle = '#4a3728';
  t.lineWidth = 2;
  t.beginPath();
  t.moveTo(30, 65);
  t.lineTo(26, 75);
  t.moveTo(48, 65);
  t.lineTo(52, 75);
  t.stroke();

  // 尾巴
  t.beginPath();
  t.moveTo(58, 48);
  t.quadraticCurveTo(68, 38, 64, 28);
  t.stroke();

  return c.toDataURL();
}

// ============ 渲染 ============
function renderAll() {
  services = [...DEFAULT_SERVICES, ...customServices];
  renderBalance();
  renderMessages();
  renderTasks();
  renderServices();
  renderHistory();
}

function renderBalance() {
  const el = document.getElementById('balance');
  el.textContent = coupons;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function renderMessages() {
  const list = document.getElementById('messagesList');
  if (messages.length === 0) {
    list.innerHTML = '<div class="message-empty">还没有留言，等待他的小纸条~</div>';
    return;
  }
  list.innerHTML = messages.slice().reverse().slice(0, 5).map(m => `
    <div class="message-card">
      <div class="msg-text">${m.text.replace(/\n/g, '<br>')}</div>
      <div class="msg-time">${m.time}</div>
    </div>
  `).join('');
}

function renderTasks() {
  const today = new Date().toLocaleDateString('zh-CN');
  const todayMeals = mealRecords.filter(r => r.date === today);
  const mealCount = todayMeals.length;
  const target = 3;
  const progress = Math.min(mealCount % target || (mealCount === 0 ? 0 : target), target);
  // 实际进度：当前周期内已记录数
  const cycleIndex = Math.floor(mealsGranted / target);
  const cycleMeals = mealCount - cycleIndex * target;
  const cycleProgress = Math.min(cycleMeals, target);

  document.getElementById('tasksList').innerHTML = `
    <div class="task-card">
      <span class="task-icon">🍽️</span>
      <div class="task-info">
        <div class="task-name">记录今天吃了什么</div>
        <div class="task-progress">每记 ${target} 餐得 1 张券 · 今日进度 ${cycleProgress}/${target}</div>
        <div class="task-progress-bar">
          <div class="fill" style="width:${(cycleProgress/target)*100}%"></div>
        </div>
      </div>
      <button class="task-btn" onclick="openRecordMeal()">记一笔</button>
    </div>
  `;
}

function renderServices() {
  const grid = document.getElementById('servicesGrid');
  grid.innerHTML = services.map(s => {
    const priceText = s.price === 0 ? '自定义' : `<span>${s.price}</span> 张`;
    return `<div class="service-card" onclick="openRedeem('${s.id}')">
      <span class="icon">${s.icon}</span>
      <div class="name">${s.name}</div>
      <div class="price">${priceText}</div>
    </div>`;
  }).join('') + `
    <div class="service-card add-card" onclick="openAddService()">
      <span class="icon">➕</span>
      <div class="name">添加服务</div>
      <div class="price">自定义</div>
    </div>`;
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">还没有兑换记录</div>';
    return;
  }
  list.innerHTML = history.slice().reverse().map(h => {
    const costClass = h.type === 'earn' ? 'hi-earn' : 'hi-cost';
    const prefix = h.type === 'earn' ? '+' : '-';
    return `<div class="history-item">
      <span class="hi-icon">${h.icon}</span>
      <div class="hi-info">
        <div class="hi-name">${h.name}${h.detail ? ' · ' + h.detail : ''}</div>
        <div class="hi-time">${h.time}</div>
      </div>
      <div class="${costClass}">${prefix}${h.cost}</div>
    </div>`;
  }).join('');
}

// ============ 兑换 ============
function openRedeem(id) {
  const s = services.find(x => x.id === id);
  if (!s) return;
  currentService = s;
  modalMode = 'redeem';
  document.getElementById('modalIcon').textContent = s.icon;
  document.getElementById('modalTitle').textContent = s.name;
  document.getElementById('deleteBtn').style.display = 'none';
  resetConfirmBtn();

  document.getElementById('modalBody').innerHTML = `
    <div class="price-row">
      <label style="margin-bottom:0;white-space:nowrap">价格：</label>
      <input type="number" id="redeemPrice" value="${s.price}" min="0" max="${coupons}">
      <span>张</span>
    </div>
    <label>备注（可选）</label>
    <input type="text" id="redeemNote" placeholder="比如：帮我按摩肩膀">
  `;

  document.getElementById('modal').classList.add('active');
  setTimeout(() => {
    const inp = document.getElementById('redeemPrice');
    if (inp) inp.focus();
  }, 300);
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  currentService = null;
  modalMode = null;
}

function confirmRedeem() {
  if (!currentService) return;

  const cost = parseInt(document.getElementById('redeemPrice').value) || 0;
  const note = document.getElementById('redeemNote').value.trim();

  if (cost <= 0) { showToast('价格至少1张'); return; }
  if (coupons < cost) {
    showToast(`摸摸券不足！需要 ${cost} 张，当前只有 ${coupons} 张`);
    return;
  }

  coupons -= cost;

  const now = new Date();
  const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  history.push({
    type: 'spend',
    icon: currentService.icon,
    name: currentService.name,
    detail: note,
    cost,
    time: timeStr,
  });

  save();
  renderAll();
  closeModal();
  playSound('redeem');
  spawnConfetti();
  showToast(`兑换成功！消耗 ${cost} 张摸摸券`);
  sendNotification(currentService, cost, note);
}

// ============ 留言 ============
function openWriteMessage() {
  modalMode = 'message';
  currentService = null;
  document.getElementById('modalIcon').textContent = '💌';
  document.getElementById('modalTitle').textContent = '写留言';
  document.getElementById('deleteBtn').style.display = 'none';
  resetConfirmBtn();
  document.getElementById('confirmBtn').textContent = '发送';
  document.getElementById('confirmBtn').onclick = confirmWriteMessage;

  document.getElementById('modalBody').innerHTML = `
    <label>想对她说的话</label>
    <textarea id="msgText" rows="3" placeholder="小可爱，今天也要开心哦~"></textarea>
  `;

  document.getElementById('modal').classList.add('active');
}

function confirmWriteMessage() {
  const text = document.getElementById('msgText').value.trim();
  if (!text) { showToast('写点什么吧'); return; }

  const now = new Date();
  const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  messages.push({ text, time: timeStr });
  save();
  renderAll();
  closeModal();
  showToast('留言已发送');
}

// ============ 三餐记录 ============
function openRecordMeal() {
  modalMode = 'meal';
  currentService = null;
  document.getElementById('modalIcon').textContent = '🍽️';
  document.getElementById('modalTitle').textContent = '记录一餐';
  document.getElementById('deleteBtn').style.display = 'none';
  resetConfirmBtn();
  document.getElementById('confirmBtn').textContent = '记录';
  document.getElementById('confirmBtn').onclick = confirmRecordMeal;

  const meals = ['早餐', '午餐', '晚餐', '下午茶', '夜宵', '零食'];
  document.getElementById('modalBody').innerHTML = `
    <label>哪一餐</label>
    <select id="mealType" style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;margin-bottom:12px;outline:none">
      ${meals.map(m => `<option value="${m}">${m}</option>`).join('')}
    </select>
    <label>吃了什么</label>
    <input type="text" id="mealContent" placeholder="比如：吃了面包和牛奶">
    <label>好不好吃</label>
    <input type="text" id="mealTaste" placeholder="比如：好吃！/ 一般般 / 不太行">
  `;

  document.getElementById('modal').classList.add('active');
}

function confirmRecordMeal() {
  const mealType = document.getElementById('mealType').value;
  const content = document.getElementById('mealContent').value.trim();
  const taste = document.getElementById('mealTaste').value.trim();

  if (!content) { showToast('填一下吃了什么吧'); return; }

  const now = new Date();
  const today = now.toLocaleDateString('zh-CN');
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  mealRecords.push({
    date: today,
    meal: mealType,
    content: taste ? `${content}，${taste}` : content,
    time: timeStr,
  });

  // 检查是否该发券了
  const totalMeals = mealRecords.length;
  const earnedFromMeals = mealsGranted;
  const newEarned = Math.floor(totalMeals / 3) - earnedFromMeals;

  if (newEarned > 0) {
    coupons += newEarned;
    mealsGranted += newEarned;
    history.push({
      type: 'earn',
      icon: '🍽️',
      name: '三餐记录奖励',
      detail: `累计记录 ${totalMeals} 餐`,
      cost: newEarned,
      time: timeStr,
    });
    playSound('earn');
    showToast(`🎉 三餐记录达标！获得 ${newEarned} 张摸摸券`);
  } else {
    showToast(`已记录！还差 ${3 - (totalMeals % 3)} 餐得券`);
  }

  save();
  renderAll();
  closeModal();
}

// ============ 添加/删除服务 ============
function openAddService() {
  modalMode = 'addService';
  currentService = null;
  document.getElementById('modalIcon').textContent = '➕';
  document.getElementById('modalTitle').textContent = '添加服务';
  document.getElementById('deleteBtn').style.display = 'none';
  resetConfirmBtn();
  document.getElementById('confirmBtn').textContent = '添加';
  document.getElementById('confirmBtn').onclick = confirmAddService;

  document.getElementById('modalBody').innerHTML = `
    <label>图标（emoji）</label>
    <input type="text" id="newIcon" value="🎁" placeholder="选一个emoji">
    <label>服务名称</label>
    <input type="text" id="newName" placeholder="比如：帮我按摩">
    <div class="price-row">
      <label style="margin-bottom:0;white-space:nowrap">默认价格：</label>
      <input type="number" id="newPrice" value="1" min="1">
      <span>张</span>
    </div>
  `;

  document.getElementById('modal').classList.add('active');
}

function confirmAddService() {
  const icon = document.getElementById('newIcon').value.trim() || '🎁';
  const name = document.getElementById('newName').value.trim();
  const price = parseInt(document.getElementById('newPrice').value) || 1;

  if (!name) { showToast('请填写服务名称'); return; }

  const id = 'custom_' + Date.now();
  customServices.push({ id, name, icon, price });
  save();
  renderAll();
  closeModal();
  showToast(`已添加「${name}」`);
}

function deleteService() {
  if (!currentService) return;
  if (!confirm(`确定删除「${currentService.name}」吗？`)) return;
  customServices = customServices.filter(s => s.id !== currentService.id);
  save();
  renderAll();
  closeModal();
  showToast('已删除');
}

function resetConfirmBtn() {
  document.getElementById('confirmBtn').textContent = '确认兑换';
  document.getElementById('confirmBtn').onclick = confirmRedeem;
}

// ============ 通知 ============
function sendNotification(service, cost, detail) {
  if (!SERVER_KEY) return;

  const title = encodeURIComponent(`她兑换了「${service.name}」`);
  const content = encodeURIComponent(detail
    ? `服务：${detail}\n消耗：${cost} 张摸摸券\n剩余：${coupons} 张`
    : `消耗：${cost} 张摸摸券\n剩余：${coupons} 张`);

  new Image().src = `https://sctapi.ftqq.com/${SERVER_KEY}.send?title=${title}&desp=${content}`;
}

// ============ 管理 ============
function adjustCoupons(dir) {
  const label = dir > 0 ? '发几张？' : '减几张？';
  const n = parseInt(prompt(label, '5'));
  if (n > 0) {
    coupons += n * dir;
    if (coupons < 0) coupons = 0;
    save();
    renderAll();
    showToast(dir > 0 ? `已发放 ${n} 张` : `已减少 ${n} 张`);
  }
}

function resetAll() {
  if (confirm('确定要重置所有数据吗？')) {
    coupons = INITIAL_COUPONS;
    history = [];
    customServices = [];
    messages = [];
    mealRecords = [];
    mealsGranted = 0;
    save();
    renderAll();
    showToast('已重置');
  }
}

// ============ 特效 ============
function spawnConfetti() {
  const colors = ['#e8836b', '#ffb6a3', '#ffd700', '#7d9b76', '#ff9ebb', '#ffab91'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (30 + Math.random() * 40) + '%';
    el.style.top = (20 + Math.random() * 10) + '%';
    el.style.width = (6 + Math.random() * 6) + 'px';
    el.style.height = (6 + Math.random() * 6) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (1 + Math.random() * 1.5) + 's';
    el.style.animationDelay = Math.random() * 0.3 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ============ 初始化 ============
load();
renderAll();
</script>
</body>
</html>
