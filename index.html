<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小猫猫的摸摸券银行</title>
<style>
:root {
  --bg: #f9f6f1;
  --card: #ffffff;
  --text: #3d3226;
  --sub: #9b8c7c;
  --accent: #e8836b;
  --accent-hover: #d4725a;
  --border: #e8e0d5;
  --green: #7d9b76;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-lg: 0 2px 6px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06);
  --radius: 14px;
  --radius-sm: 10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 32px 20px 60px;
}

/* Header */
.header {
  text-align: center;
  padding: 20px 0 10px;
}

.header-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 2px;
}

.header-dog {
  display: block;
  margin: 8px auto 0;
  width: 80px;
  height: 80px;
}

/* Balance */
.balance-section {
  text-align: center;
  padding: 16px 20px 24px;
}

.balance-amount {
  font-size: 72px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}

.balance-amount.pop { animation: pop 0.4s ease; }

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.balance-unit {
  font-size: 15px;
  color: var(--sub);
  margin-top: 6px;
  letter-spacing: 1px;
}

/* Admin bar */
.admin-bar {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.admin-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--sub);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.admin-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Section titles */
.section-title {
  font-size: 14px;
  color: var(--sub);
  letter-spacing: 2px;
  margin-bottom: 14px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.section-title::before, .section-title::after {
  content: '';
  width: 30px;
  height: 1px;
  background: var(--border);
}

/* Messages */
.messages-section { margin-bottom: 28px; }

.message-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  border-left: 3px solid var(--accent);
}

.message-card .msg-text { font-size: 15px; line-height: 1.7; color: var(--text); }
.message-card .msg-time { font-size: 12px; color: var(--sub); margin-top: 8px; }

.message-empty {
  text-align: center;
  color: var(--sub);
  font-size: 14px;
  padding: 16px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* Tasks */
.tasks-section { margin-bottom: 28px; }

.task-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.task-card .task-icon { font-size: 28px; flex-shrink: 0; }
.task-card .task-info { flex: 1; min-width: 0; }
.task-card .task-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.task-card .task-desc { font-size: 12px; color: var(--sub); }

.task-card .task-btn {
  padding: 8px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  flex-shrink: 0;
  white-space: nowrap;
}

.task-card .task-btn:hover { background: var(--accent-hover); }
.task-card .task-btn:active { transform: scale(0.95); }

.task-card .task-check {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Service cards */
.services-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 32px;
}

.service-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 16px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s;
  border: 1.5px solid transparent;
  text-align: center;
}

.service-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
.service-card:active { transform: scale(0.97); }
.service-card .icon { font-size: 36px; margin-bottom: 10px; display: block; }
.service-card .name { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.service-card .price { font-size: 13px; color: var(--accent); font-weight: 500; }
.service-card .price span { font-size: 16px; font-weight: 700; }
.service-card.add-card { border-style: dashed; border-color: var(--border); opacity: 0.7; }
.service-card.add-card:hover { opacity: 1; border-color: var(--accent); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.3);
  z-index: 100;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px 24px;
  width: 90%;
  max-width: 380px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.15);
  animation: slideUp 0.3s ease;
  max-height: 85vh;
  overflow-y: auto;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal h3 { font-size: 20px; margin-bottom: 8px; text-align: center; }
.modal .modal-icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
.modal label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }

.modal input, .modal textarea, .modal select {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 12px;
  resize: vertical;
}

.modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }

.modal .modal-actions { display: flex; gap: 10px; margin-top: 4px; }

.modal .btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.modal .btn-cancel { background: var(--bg); color: var(--sub); }
.modal .btn-cancel:hover { background: var(--border); }
.modal .btn-confirm { background: var(--accent); color: #fff; }
.modal .btn-confirm:hover { background: var(--accent-hover); }

.modal .btn-delete {
  background: none; color: #c62828; font-size: 13px; font-weight: 400;
  padding: 8px; margin-top: 8px; border: none; cursor: pointer;
  text-decoration: underline; font-family: inherit;
}

.modal .price-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.modal .price-row input { width: 80px; margin-bottom: 0; }
.modal .price-row span { color: var(--sub); font-size: 14px; }

/* History */
.history-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--card);
  border-radius: var(--radius-sm); margin-bottom: 8px;
  box-shadow: var(--shadow); font-size: 14px;
}

.history-item .hi-icon { font-size: 24px; flex-shrink: 0; }
.history-item .hi-info { flex: 1; min-width: 0; }
.history-item .hi-name { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-item .hi-time { font-size: 12px; color: var(--sub); }
.history-item .hi-cost { font-weight: 600; color: var(--accent); flex-shrink: 0; }
.history-item .hi-earn { font-weight: 600; color: var(--green); flex-shrink: 0; }

.history-empty {
  text-align: center; color: var(--sub); font-size: 14px;
  padding: 20px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
}

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 24px;
  border-radius: 20px; font-size: 14px; z-index: 200;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}

.toast.show { opacity: 1; }

/* Confetti */
.confetti-piece {
  position: fixed; z-index: 150; pointer-events: none;
  animation: confettiFall 1.5s ease-out forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 400px) {
  .services-grid { grid-template-columns: 1fr; }
  .balance-amount { font-size: 56px; }
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="header-title">🐱 小猫猫的摸摸券银行</div>
    <canvas class="header-dog" id="headerDog" width="160" height="160"></canvas>
  </div>

  <div class="balance-section">
    <div class="balance-amount" id="balance">20</div>
    <div class="balance-unit">张 摸 摸 券</div>
  </div>

  <div class="admin-bar">
    <button class="admin-btn" onclick="adjustCoupons(1)">+ 发券</button>
    <button class="admin-btn" onclick="adjustCoupons(-1)">- 减券</button>
    <button class="admin-btn" onclick="openWriteMessage()">✎ 留言</button>
    <button class="admin-btn" onclick="resetAll()">重置</button>
  </div>

  <div class="messages-section">
    <div class="section-title">💌 留言板</div>
    <div id="messagesList"></div>
  </div>

  <div class="tasks-section">
    <div class="section-title">🎯 每日任务</div>
    <div id="tasksList"></div>
  </div>

  <div class="section-title">🛒 兑换服务</div>
  <div class="services-grid" id="servicesGrid"></div>

  <div class="section-title">📋 记录</div>
  <div id="historyList"></div>

</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon" id="modalIcon"></div>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-confirm" id="confirmBtn" onclick="confirmRedeem()">确认</button>
    </div>
    <button class="btn-delete" id="deleteBtn" style="display:none" onclick="deleteService()">删除这个服务</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 配置 ============
const SERVER_KEY = 'SCT403508TEFSic7kAfmNpYi22Zxku0ID7';

const DEFAULT_SERVICES = [
  { id: 'touch', name: '摸摸10分钟', icon: '🤲', price: 1 },
  { id: 'hug', name: '抱抱', icon: '🤗', price: 1 },
  { id: 'kiss', name: '亲亲', icon: '💋', price: 1 },
  { id: 'errand', name: '跑腿服务', icon: '🏃', price: 1 },
  { id: 'chores', name: '做家务', icon: '🧹', price: 3 },
  { id: 'cheer', name: '哄开心', icon: '🎤', price: 3 },
];

const INITIAL_COUPONS = 20;

// ============ 线条小狗动效 ============
// 如需替换静态图，把PNG/GIF放 assets/line-dog.png 替换下面代码
(function animateDog() {
  const c = document.getElementById('headerDog');
  if (!c) return;
  const t = c.getContext('2d');
  let frame = 0;

  function draw() {
    t.clearRect(0, 0, 160, 160);
    t.imageSmoothingEnabled = true;
    t.save();
    t.translate(80, 70);
    // 身体微微上下浮动
    const bob = Math.sin(frame * 0.05) * 2;
    t.translate(0, bob);

    t.strokeStyle = '#4a3728'; t.lineWidth = 2.2; t.lineCap = 'round'; t.lineJoin = 'round';

    // 身体
    t.fillStyle = '#fff';
    t.beginPath(); t.ellipse(0, 12, 17, 15, 0, 0, Math.PI*2); t.fill(); t.stroke();

    // 头
    t.beginPath(); t.ellipse(0, -8, 15, 13, 0, 0, Math.PI*2); t.fill(); t.stroke();

    // 耳朵 - 微微抖动
    const earWiggle = Math.sin(frame * 0.08) * 1.5;
    t.fillStyle = '#FFE0B2';
    t.beginPath(); t.moveTo(-12, -14); t.lineTo(-18 + earWiggle, -28); t.lineTo(-6, -18); t.closePath(); t.fill(); t.stroke();
    t.beginPath(); t.moveTo(12, -14); t.lineTo(18 - earWiggle, -28); t.lineTo(6, -18); t.closePath(); t.fill(); t.stroke();

    // 眼睛 - 偶尔眨眼
    const blink = Math.sin(frame * 0.03) > 0.92 ? 0.5 : 1;
    t.fillStyle = '#4a3728';
    t.save(); t.scale(1, blink); t.beginPath(); t.arc(-6, -8, 2.5, 0, Math.PI*2); t.fill(); t.restore();
    t.save(); t.scale(1, blink); t.beginPath(); t.arc(7, -8, 2.5, 0, Math.PI*2); t.fill(); t.restore();

    // 鼻子
    t.beginPath(); t.arc(0.5, -5, 2, 0, Math.PI*2); t.fill();

    // 嘴
    t.strokeStyle = '#4a3728'; t.lineWidth = 1.5;
    t.beginPath(); t.moveTo(0.5, -3); t.lineTo(-2, 1); t.moveTo(0.5, -3); t.lineTo(3, 1); t.stroke();

    // 腮红
    t.fillStyle = 'rgba(255,150,150,0.45)';
    t.beginPath(); t.arc(-10, -4, 3.5, 0, Math.PI*2); t.fill();
    t.beginPath(); t.arc(12, -4, 3.5, 0, Math.PI*2); t.fill();

    // 前腿
    t.strokeStyle = '#4a3728'; t.lineWidth = 2;
    t.beginPath(); t.moveTo(-10, 22); t.lineTo(-12, 32); t.moveTo(8, 22); t.lineTo(10, 32); t.stroke();

    // 尾巴 - 摇尾巴动效
    const tailWag = Math.sin(frame * 0.1) * 15;
    t.strokeStyle = '#4a3728'; t.lineWidth = 2;
    t.beginPath(); t.moveTo(15, 6);
    t.quadraticCurveTo(26 + tailWag, tailWag - 4, 22 + tailWag * 0.5, tailWag - 14);
    t.stroke();

    t.restore();
    frame++;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ============ 音效 ============
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (type === 'redeem') {
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.1 + 0.05);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.1 + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.1); osc.stop(ctx.currentTime + i * 0.1 + 0.3);
      });
    } else if (type === 'earn') {
      [880, 1100].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.12);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.12 + 0.04);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.12 + 0.25);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.12); osc.stop(ctx.currentTime + i * 0.12 + 0.25);
      });
    }
  } catch(e) {}
}

// ============ 状态 ============
let coupons = INITIAL_COUPONS;
let services = [];
let customServices = [];
let history = [];
let messages = [];
let mealRecords = [];    // 猫饭记录
let mealsGranted = 0;   // 已通过猫饭发放的券数
let sleepRecords = [];  // 早睡打卡
let selfieRecords = []; // 自拍记录

function load() {
  try {
    const d = JSON.parse(localStorage.getItem('coupon_state'));
    if (d) {
      coupons = d.coupons ?? INITIAL_COUPONS;
      history = d.history ?? [];
      customServices = d.customServices ?? [];
      messages = d.messages ?? [];
      mealRecords = d.mealRecords ?? [];
      mealsGranted = d.mealsGranted ?? 0;
      sleepRecords = d.sleepRecords ?? [];
      selfieRecords = d.selfieRecords ?? [];
    }
  } catch(e) {}
  services = [...DEFAULT_SERVICES, ...customServices];
}

function save() {
  localStorage.setItem('coupon_state', JSON.stringify({
    coupons, history, customServices, messages, mealRecords, mealsGranted, sleepRecords, selfieRecords
  }));
}

// ============ 渲染 ============
function renderAll() {
  services = [...DEFAULT_SERVICES, ...customServices];
  renderBalance();
  renderMessages();
  renderTasks();
  renderServices();
  renderHistory();
}

function renderBalance() {
  const el = document.getElementById('balance');
  el.textContent = coupons;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function renderMessages() {
  const list = document.getElementById('messagesList');
  if (messages.length === 0) {
    list.innerHTML = '<div class="message-empty">还没有留言，等待他的小纸条~</div>';
    return;
  }
  list.innerHTML = messages.slice().reverse().slice(0, 5).map(m => `
    <div class="message-card">
      <div class="msg-text">${m.text.replace(/\n/g, '<br>')}</div>
      <div class="msg-time">${m.time}</div>
    </div>
  `).join('');
}

function renderTasks() {
  const today = new Date().toLocaleDateString('zh-CN');
  const todayMeals = mealRecords.filter(r => r.date === today);
  const totalMeals = mealRecords.length;
  const earned = mealsGranted;
  const cycleProgress = (totalMeals % 3);
  const needMore = 3 - cycleProgress;

  const todaySleep = sleepRecords.find(r => r.date === today);
  const todaySelfie = selfieRecords.find(r => r.date === today);

  document.getElementById('tasksList').innerHTML = `
    <!-- 猫饭记录 -->
    <div class="task-card">
      <span class="task-icon">🍽️</span>
      <div class="task-info">
        <div class="task-name">猫饭记录</div>
        <div class="task-desc">记录今天吃了什么 · 每3餐得1张券 · 今日${todayMeals.length}餐</div>
      </div>
      ${needMore === 0 ? '<span class="task-check">✓</span>' : ''}
      <button class="task-btn" onclick="openRecordMeal()">记一笔</button>
    </div>
    <!-- 早睡打卡 -->
    <div class="task-card">
      <span class="task-icon">💤</span>
      <div class="task-info">
        <div class="task-name">早睡打卡</div>
        <div class="task-desc">凌晨2:30前睡觉都算 · 每天1张券</div>
      </div>
      ${todaySleep ? '<span class="task-check">✓</span>' : ''}
      <button class="task-btn" onclick="openSleepCheck()" ${todaySleep ? 'disabled style="opacity:0.5;cursor:default"' : ''}>${todaySleep ? '已打卡' : '打卡'}</button>
    </div>
    <!-- 自拍 -->
    <div class="task-card">
      <span class="task-icon">📸</span>
      <div class="task-info">
        <div class="task-name">发自拍</div>
        <div class="task-desc">发一张自拍 · 每天1张券</div>
      </div>
      ${todaySelfie ? '<span class="task-check">✓</span>' : ''}
      <button class="task-btn" onclick="openSelfieCheck()" ${todaySelfie ? 'disabled style="opacity:0.5;cursor:default"' : ''}>${todaySelfie ? '已打卡' : '打卡'}</button>
    </div>
  `;
}

function renderServices() {
  const grid = document.getElementById('servicesGrid');
  grid.innerHTML = services.map(s => {
    const priceText = s.price === 0 ? '自定义' : `<span>${s.price}</span> 张`;
    return `<div class="service-card" onclick="openRedeem('${s.id}')">
      <span class="icon">${s.icon}</span>
      <div class="name">${s.name}</div>
      <div class="price">${priceText}</div>
    </div>`;
  }).join('') + `
    <div class="service-card add-card" onclick="openAddService()">
      <span class="icon">➕</span>
      <div class="name">添加服务</div>
      <div class="price">自定义</div>
    </div>`;
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">还没有记录</div>';
    return;
  }
  list.innerHTML = history.slice().reverse().map(h => {
    const costClass = h.type === 'earn' ? 'hi-earn' : 'hi-cost';
    const prefix = h.type === 'earn' ? '+' : '-';
    return `<div class="history-item">
      <span class="hi-icon">${h.icon}</span>
      <div class="hi-info">
        <div class="hi-name">${h.name}${h.detail ? ' · ' + h.detail : ''}</div>
        <div class="hi-time">${h.time}</div>
      </div>
      <div class="${costClass}">${prefix}${h.cost}</div>
    </div>`;
  }).join('');
}

// ============ 时间工具 ============
function nowStr() {
  const n = new Date();
  return `${n.getMonth()+1}/${n.getDate()} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}

function todayStr() {
  return new Date().toLocaleDateString('zh-CN');
}

// ============ 兑换 ============
function openRedeem(id) {
  const s = services.find(x => x.id === id);
  if (!s) return;
  currentService = s;
  document.getElementById('modalIcon').textContent = s.icon;
  document.getElementById('modalTitle').textContent = s.name;
  document.getElementById('deleteBtn').style.display = 'none';
  resetConfirmBtn('confirmRedeem', '确认兑换');

  document.getElementById('modalBody').innerHTML = `
    <div class="price-row">
      <label style="margin-bottom:0;white-space:nowrap">价格：</label>
      <input type="number" id="redeemPrice" value="${s.price}" min="0" max="${coupons}">
      <span>张</span>
    </div>
    <label>备注（可选）</label>
    <input type="text" id="redeemNote" placeholder="比如：帮我按摩肩膀">
  `;

  document.getElementById('modal').classList.add('active');
  setTimeout(() => { const inp = document.getElementById('redeemPrice'); if (inp) inp.focus(); }, 300);
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  currentService = null;
}

function confirmRedeem() {
  if (!currentService) return;
  const cost = parseInt(document.getElementById('redeemPrice').value) || 0;
  const note = document.getElementById('redeemNote').value.trim();

  if (cost <= 0) { showToast('价格至少1张'); return; }
  if (coupons < cost) { showToast(`摸摸券不足！需要 ${cost} 张，当前只有 ${coupons} 张`); return; }

  coupons -= cost;
  history.push({ type: 'spend', icon: currentService.icon, name: currentService.name, detail: note, cost, time: nowStr() });
  save(); renderAll(); closeModal();
  playSound('redeem'); spawnConfetti();
  showToast(`兑换成功！消耗 ${cost} 张摸摸券`);
  sendNotification(currentService, cost, note);
}

// ============ 留言 ============
function openWriteMessage() {
  currentService = null;
  document.getElementById('modalIcon').textContent = '💌';
  document.getElementById('modalTitle').textContent = '写留言';
  document.getElementById('deleteBtn').style.display = 'none';
  resetConfirmBtn('confirmWriteMessage', '发送');

  document.getElementById('modalBody').innerHTML = `
    <label>想对她说的话</label>
    <textarea id="msgText" rows="3" placeholder="小可爱，今天也要开心哦~"></textarea>
  `;
  document.getElementById('modal').classList.add('active');
}

function confirmWriteMessage() {
  const text = document.getElementById('msgText').value.trim();
  if (!text) { showToast('写点什么吧'); return; }
  messages.push({ text, time: nowStr() });
  save(); renderAll(); closeModal();
  showToast('留言已发送');
}

// ============ 猫饭记录 ============
function openRecordMeal() {
  currentService = null;
  document.getElementById('modalIcon').textContent = '🍽️';
  document.getElementById('modalTitle').textContent = '猫饭记录';
  document.getElementById('deleteBtn').style.display = 'none';
  resetConfirmBtn('confirmRecordMeal', '记录');

  const meals = ['早餐', '午餐', '晚餐', '下午茶', '夜宵', '零食'];
  document.getElementById('modalBody').innerHTML = `
    <label>哪一餐</label>
    <select id="mealType">${meals.map(m => `<option>${m}</option>`).join('')}</select>
    <label>吃了什么</label>
    <input type="text" id="mealContent" placeholder="比如：吃了面包和牛奶">
    <label>好不好吃</label>
    <input type="text" id="mealTaste" placeholder="比如：好吃！/ 一般般 / 不太行">
  `;
  document.getElementById('modal').classList.add('active');
}

function confirmRecordMeal() {
  const mealType = document.getElementById('mealType').value;
  const content = document.getElementById('mealContent').value.trim();
  const taste = document.getElementById('mealTaste').value.trim();

  if (!content) { showToast('填一下吃了什么吧'); return; }

  mealRecords.push({ date: todayStr(), meal: mealType, content: taste ? `${content}，${taste}` : content, time: nowStr() });

  const totalMeals = mealRecords.length;
  const earned = mealsGranted;
  const newEarned = Math.floor(totalMeals / 3) - earned;

  if (newEarned > 0) {
    coupons += newEarned;
    mealsGranted += newEarned;
    history.push({ type: 'earn', icon: '🍽️', name: '猫饭奖励', detail: `累计 ${totalMeals} 餐`, cost: newEarned, time: nowStr() });
    playSound('earn');
    showToast(`🎉 猫饭达标！获得 ${newEarned} 张摸摸券`);
  } else {
    showToast(`已记录！还差 ${3 - (totalMeals % 3)} 餐得券`);
  }

  save(); renderAll(); closeModal();
}

// ============ 早睡打卡 ============
function openSleepCheck() {
  const today = todayStr();
  if (sleepRecords.find(r => r.date === today)) { showToast('今天已经打过卡啦'); return; }

  const now = new Date();
  const hour = now.getHours();
  const minute = now.getMinutes();
  // 凌晨2:30前都算早睡（即 hour < 2 或 hour == 2 且 minute <= 30）
  const isEarly = (hour < 2) || (hour === 2 && minute <= 30);

  sleepRecords.push({ date: today, time: nowStr(), early: isEarly });

  if (isEarly) {
    coupons += 1;
    history.push({ type: 'earn', icon: '💤', name: '早睡打卡', detail: '凌晨2:30前睡', cost: 1, time: nowStr() });
    playSound('earn');
    showToast('💤 早睡成功！获得 1 张摸摸券');
  } else {
    history.push({ type: 'earn', icon: '💤', name: '熬夜打卡', detail: '超过2:30了哦', cost: 0, time: nowStr() });
    showToast('打卡了，但超过2:30了，明天早点睡哦~');
  }

  save(); renderAll();
}

// ============ 自拍 ============
function openSelfieCheck() {
  const today = todayStr();
  if (selfieRecords.find(r => r.date === today)) { showToast('今天已经发过啦'); return; }

  selfieRecords.push({ date: today, time: nowStr() });
  coupons += 1;
  history.push({ type: 'earn', icon: '📸', name: '自拍奖励', detail: '发了一张自拍', cost: 1, time: nowStr() });
  playSound('earn');
  showToast('📸 自拍成功！获得 1 张摸摸券');

  save(); renderAll();
}

// ============ 添加/删除服务 ============
function openAddService() {
  currentService = null;
  document.getElementById('modalIcon').textContent = '➕';
  document.getElementById('modalTitle').textContent = '添加服务';
  document.getElementById('deleteBtn').style.display = 'none';
  resetConfirmBtn('confirmAddService', '添加');

  document.getElementById('modalBody').innerHTML = `
    <label>图标（emoji）</label>
    <input type="text" id="newIcon" value="🎁" placeholder="选一个emoji">
    <label>服务名称</label>
    <input type="text" id="newName" placeholder="比如：帮我按摩">
    <div class="price-row">
      <label style="margin-bottom:0;white-space:nowrap">默认价格：</label>
      <input type="number" id="newPrice" value="1" min="1">
      <span>张</span>
    </div>
  `;
  document.getElementById('modal').classList.add('active');
}

function confirmAddService() {
  const icon = document.getElementById('newIcon').value.trim() || '🎁';
  const name = document.getElementById('newName').value.trim();
  const price = parseInt(document.getElementById('newPrice').value) || 1;
  if (!name) { showToast('请填写服务名称'); return; }
  customServices.push({ id: 'custom_' + Date.now(), name, icon, price });
  save(); renderAll(); closeModal();
  showToast(`已添加「${name}」`);
}

function deleteService() {
  if (!currentService) return;
  if (!confirm(`确定删除「${currentService.name}」吗？`)) return;
  customServices = customServices.filter(s => s.id !== currentService.id);
  save(); renderAll(); closeModal();
  showToast('已删除');
}

function resetConfirmBtn(fn, text) {
  document.getElementById('confirmBtn').textContent = text;
  document.getElementById('confirmBtn').onclick = window[fn];
}

// ============ 通知 ============
function sendNotification(service, cost, detail) {
  if (!SERVER_KEY) return;
  const title = encodeURIComponent(`她兑换了「${service.name}」`);
  const content = encodeURIComponent(detail
    ? `服务：${detail}\n消耗：${cost} 张摸摸券\n剩余：${coupons} 张`
    : `消耗：${cost} 张摸摸券\n剩余：${coupons} 张`);
  new Image().src = `https://sctapi.ftqq.com/${SERVER_KEY}.send?title=${title}&desp=${content}`;
}

// ============ 管理 ============
function adjustCoupons(dir) {
  const label = dir > 0 ? '发几张？' : '减几张？';
  const n = parseInt(prompt(label, '5'));
  if (n > 0) {
    coupons += n * dir;
    if (coupons < 0) coupons = 0;
    save(); renderAll();
    showToast(dir > 0 ? `已发放 ${n} 张` : `已减少 ${n} 张`);
  }
}

function resetAll() {
  if (confirm('确定要重置所有数据吗？')) {
    coupons = INITIAL_COUPONS;
    history = []; customServices = []; messages = [];
    mealRecords = []; mealsGranted = 0; sleepRecords = []; selfieRecords = [];
    save(); renderAll();
    showToast('已重置');
  }
}

// ============ 特效 ============
function spawnConfetti() {
  const colors = ['#e8836b', '#ffb6a3', '#ffd700', '#7d9b76', '#ff9ebb', '#ffab91'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (30 + Math.random() * 40) + '%';
    el.style.top = (20 + Math.random() * 10) + '%';
    el.style.width = (6 + Math.random() * 6) + 'px';
    el.style.height = (6 + Math.random() * 6) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (1 + Math.random() * 1.5) + 's';
    el.style.animationDelay = Math.random() * 0.3 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ============ 初始化 ============
load();
renderAll();
</script>
</body>
